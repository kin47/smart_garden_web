name: smart_garden
description: An IoT App that integrated AI for garden management using Flutter with Bloc, and Clean Architecture

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  injectable: ^3.0.0
  easy_localization: ^3.0.7
  get_it: ^9.2.1
  dartz: 0.10.1
  retrofit: ^4.1.0
  dio: ^5.5.0+1
  logger: ^2.4.0
  url_launcher: ^6.3.0
  event_bus: ^2.0.0
  auto_route: ^11.1.0
  connectivity_plus: ^7.3.1
  stream_transform: ^2.1.0
  universal_html: ^2.2.4

  # state management
  flutter_bloc: ^9.1.1

  # mqtt
  mqtt_client: ^10.2.1

  # web socket
  web_socket_channel: ^3.0.1

  # firebase
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0

  # notification
  firebase_messaging: ^16.7.0

  # storage
  shared_preferences: ^2.3.1

  # annotation/serialization/generator
  copy_with_extension: ^17.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.0.7

  #responsive
  flutter_screenutil: ^5.9.3
  data_table_2: ^3.0.0
  responsive_framework: ^1.5.1

  flutter_gen: ^5.6.0

  top_snackbar_flutter: ^3.1.0
  cached_network_image: ^4.0.0
  infinite_scroll_pagination: ^4.0.0
  equatable: ^3.0.0
  shimmer: ^4.0.0
  flutter_slidable: ^4.0.3
  mobile_scanner: ^7.4.2
  flutter_smart_dialog: ^5.3.0
  image_picker: ^1.1.2
  permission_handler: ^13.0.2
  carousel_slider: ^5.0.0
  image_pixels: ^4.0.2
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.11
  copy_with_extension_gen: ^17.1.0
  flutter_gen_runner: ^5.3.2
  auto_route_generator: ^10.6.0

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    flare_flutter: true
    rive: true
    lottie: true

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 200
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 600
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 800
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 900

  assets:
    - assets/translations/
    - assets/env/
    - assets/images/
    - assets/svg/


